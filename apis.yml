name: MycroFriends
description: >-
  MycroFriends is a consumer health and wellness company that helps people
  become healthier through education and coaching centered on the connection
  between the human microbiome, nutrition, and overall health. Founded by George
  Cigale (previously founder of the online tutoring company Tutor.com) and
  headquartered in New York City, the company launched via a 2017 crowdfunding
  campaign and works with scientists, physicians, dietitians, and technologists
  to deliver microbiome education, personalized nutritional and lifestyle
  guidance, and access to expert health coaches. It was surfaced in the API
  Evangelist network as a portfolio company of Bloomberg Beta. As of this
  enrichment pass MycroFriends publishes no public API, developer portal, SDK,
  or machine-readable API surface, and its former website resolves only to a
  default (unconfigured) Azure App Service host.
